services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: utility-lens-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - utility_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/utilities.db
      - PYTHONUNBUFFERED=1
      - NODE_ENV=${NODE_ENV:-development}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: utility-lens-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-${ALLOWED_HOSTS:-}}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  utility_data:
